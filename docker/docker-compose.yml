version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: dotnetforge-postgres
    environment:
      POSTGRES_USER: dotnetforge
      POSTGRES_PASSWORD: dotnetforge
      POSTGRES_DB: dotnetforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotnetforge -d dotnetforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

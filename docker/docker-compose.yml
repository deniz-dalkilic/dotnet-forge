version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: dotnetforge-postgres
    environment:
      POSTGRES_USER: dotnetforge
      POSTGRES_PASSWORD: dotnetforge
      POSTGRES_DB: dotnetforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

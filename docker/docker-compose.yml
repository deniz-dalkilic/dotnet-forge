name: dotnetforge-stack

services:
    postgres:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_USER: appuser
            POSTGRES_PASSWORD: apppassword
            POSTGRES_DB: appdb
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        volumes:
            - postgres_data:/var/lib/postgresql/data

    seq:
        image: datalust/seq:2025.2
        restart: unless-stopped
        environment:
            ACCEPT_EULA: "Y"
            SEQ_FIRSTRUN_ADMINPASSWORD: "ChangeMe123!"
        ports:
            - "5341:5341"
            - "8081:80"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:80/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        volumes:
            - seq_data:/data

volumes:
    postgres_data:
    seq_data:
